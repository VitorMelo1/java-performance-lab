spring.application.name=mvc-jdbc
server.port=8080
spring.threads.virtual.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
server.error.include-message=never
lab.remote-url=${REMOTE_URL:http://localhost:9090}
lab.http-pool-size=${HTTP_POOL_SIZE:100}
logging.level.root=WARN
logging.level.br.edu.benchmark=INFO
spring.main.banner-mode=off
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:lab}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:lab_local_only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=2
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=1000
server.tomcat.max-connections=8192
lab.http-client=${LAB_HTTP_CLIENT:resttemplate}
spring.cloud.openfeign.client.config.catalog.connectTimeout=1000
spring.cloud.openfeign.client.config.catalog.readTimeout=2000
spring.cloud.openfeign.httpclient.hc5.enabled=true

