spring.application.name=mvc-jdbc
server.port=8080
spring.threads.virtual.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
server.error.include-message=never
lab.remote-url=${REMOTE_URL:http://localhost:9090}
lab.http-pool-size=${HTTP_POOL_SIZE:100}
logging.level.root=WARN
logging.level.br.edu.benchmark=INFO
spring.main.banner-mode=off
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:lab}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:lab_local_only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=2
# Explicito para espelhar spring.r2dbc.pool.max-life-time do braco reativo.
spring.datasource.hikari.max-lifetime=1800000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=1000
server.tomcat.max-connections=8192
lab.http-client=${LAB_HTTP_CLIENT:resttemplate}
spring.cloud.openfeign.client.config.catalog.connectTimeout=1000
spring.cloud.openfeign.client.config.catalog.readTimeout=2000
spring.cloud.openfeign.httpclient.hc5.enabled=true


lab.inventory-url=${INVENTORY_URL:http://stock-service:8080}
spring.cloud.openfeign.client.config.inventory.connectTimeout=1000
spring.cloud.openfeign.client.config.inventory.readTimeout=2000

# Protocolo 4: medicao do lado do servidor, independente do gerador.
# percentiles-histogram publica http_server_requests_seconds_bucket como contadores
# ACUMULADOS. Dois scrapes, um antes e um depois da medicao, permitem subtrair os baldes e
# obter os percentis exatamente da janela medida, sem depender do relogio do k6 nem do
# piso dependente da taxa observado no gerador. Os limites cobrem de sub-milissegundo
# (consulta por chave primaria) a segundos (saturacao).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=100us
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.slo.http.server.requests=500us,1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
