spring.application.name=stock-service
server.port=8080
spring.threads.virtual.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.datasource.url=jdbc:postgresql://${DB_HOST:stock-db}:5432/${DB_NAME:inventory}
spring.datasource.username=${DB_USER:inventory}
spring.datasource.password=${DB_PASSWORD:inventory_local_only}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=2
server.tomcat.threads.max=200
server.tomcat.accept-count=1000
logging.level.root=WARN
spring.main.banner-mode=off

# Protocolo 4: medicao do lado do servidor, independente do gerador.
# percentiles-histogram publica http_server_requests_seconds_bucket como contadores
# ACUMULADOS. Dois scrapes, um antes e um depois da medicao, permitem subtrair os baldes e
# obter os percentis exatamente da janela medida, sem depender do relogio do k6 nem do
# piso dependente da taxa observado no gerador. Os limites cobrem de sub-milissegundo
# (consulta por chave primaria) a segundos (saturacao).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=100us
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.slo.http.server.requests=500us,1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
