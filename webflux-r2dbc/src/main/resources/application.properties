spring.application.name=webflux-r2dbc
server.port=8080
spring.threads.virtual.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
server.error.include-message=never
lab.remote-url=${REMOTE_URL:http://localhost:9090}
lab.http-pool-size=${HTTP_POOL_SIZE:100}
logging.level.root=WARN
logging.level.br.edu.benchmark=INFO
spring.main.banner-mode=off
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:lab}
spring.r2dbc.username=${DB_USER:lab}
spring.r2dbc.password=${DB_PASSWORD:lab_local_only}
spring.r2dbc.pool.initial-size=${DB_POOL_SIZE:20}
spring.r2dbc.pool.max-size=${DB_POOL_SIZE:20}
spring.r2dbc.pool.max-acquire-time=2s
spring.r2dbc.pool.max-create-connection-time=2s

