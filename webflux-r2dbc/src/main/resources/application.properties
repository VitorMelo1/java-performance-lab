spring.application.name=webflux-r2dbc
server.port=8080
spring.threads.virtual.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
server.error.include-message=never
lab.remote-url=${REMOTE_URL:http://localhost:9090}
lab.http-pool-size=${HTTP_POOL_SIZE:100}
logging.level.root=WARN
logging.level.br.edu.benchmark=INFO
spring.main.banner-mode=off
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:lab}
spring.r2dbc.username=${DB_USER:lab}
spring.r2dbc.password=${DB_PASSWORD:lab_local_only}
spring.r2dbc.pool.initial-size=${DB_POOL_SIZE:20}
spring.r2dbc.pool.min-idle=${DB_POOL_SIZE:20}
spring.r2dbc.pool.max-size=${DB_POOL_SIZE:20}
spring.r2dbc.pool.max-acquire-time=2s
spring.r2dbc.pool.max-create-connection-time=2s
# Alinhamento explicito com o HikariCP do braco bloqueante. O padrao do r2dbc-pool e
# acquire-retry=1: uma tentativa extra de aquisicao que o Hikari nao faz, e que mudaria
# o tempo observado sob saturacao. max-life-time reproduz o maxLifetime padrao do Hikari.
spring.r2dbc.pool.acquire-retry=0
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-life-time=30m
# Assimetria conhecida e nao configuravel: o r2dbc-pool nao expoe limite para a fila de
# aquisicoes pendentes, enquanto no MVC a espera e limitada pelos 200 workers do Tomcat.
# Sob saturacao o braco reativo acumula fila maior. Declarar isso nos resultados.


lab.inventory-url=${INVENTORY_URL:http://stock-service:8080}

# Protocolo 4: medicao do lado do servidor, independente do gerador.
# percentiles-histogram publica http_server_requests_seconds_bucket como contadores
# ACUMULADOS. Dois scrapes, um antes e um depois da medicao, permitem subtrair os baldes e
# obter os percentis exatamente da janela medida, sem depender do relogio do k6 nem do
# piso dependente da taxa observado no gerador. Os limites cobrem de sub-milissegundo
# (consulta por chave primaria) a segundos (saturacao).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=100us
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.slo.http.server.requests=500us,1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
